<div class="datatable">
  <form method="get" class="dt-filter">
    <input type="text" name="q" value="{q}" placeholder="Search...">
    <button type="submit">Search</button>
  </form>
  <table>
    <thead>
      <tr>
        {#each columns as col}
        <th>{col}</th>
        {/each}
      </tr>
    </thead>
    <tbody>
      {#each rows as row}
      <tr>
        {#each Object.entries(row) as [key, value]}
        <td>{value}</td>
        {/each}
      </tr>
      {/each}
    </tbody>
  </table>
  <div class="dt-pagination">
    {#each pages as p}
    <a href="?q={q}&page={p}">{p}</a>
    {/each}
  </div>
</div>
